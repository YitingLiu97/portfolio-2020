<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">All Connecting system architecture and development progress</title>
  <desc id="desc">An early browser to Node for Max and packet capture experiment did not provide reliable packet flow. The recorded study uses a browser request, Carnivore packet capture in Processing, sixteen address-based visual paths, Syphon output, MadMapper, and room projection.</desc>
  <defs>
    <style>
      .bg{fill:#f8f5f1}.card{fill:#fff;stroke:#d8d2cb;stroke-width:2}.card-active{fill:#fff;stroke:#aa2525;stroke-width:2}.ink{fill:#211d1d}.muted{fill:#655f5b}.accent{fill:#aa2525}.rule{stroke:#d8d2cb;stroke-width:2}.arrow{stroke:#aa2525;stroke-width:2.5;fill:none;marker-end:url(#head)}.arrow-muted{stroke:#9b928b;stroke-width:2;fill:none;marker-end:url(#head-muted)}.label{font:700 17px Arial,Helvetica,sans-serif;letter-spacing:2px}.step{font:700 18px Arial,Helvetica,sans-serif}.detail{font:15px Arial,Helvetica,sans-serif}.small{font:14px Arial,Helvetica,sans-serif}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aa2525"/></marker>
    <marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#9b928b"/></marker>
  </defs>
  <rect class="bg" width="960" height="520" rx="18"/>
  <text x="40" y="49" class="label muted">01 / EXPERIMENT</text>
  <text x="40" y="76" class="small muted">Trying to read network activity in Max/MSP</text>
  <rect class="card" x="40" y="99" width="205" height="105" rx="10"/>
  <text x="60" y="137" class="step ink">Browser request</text>
  <text x="60" y="165" class="detail muted">Visitor searches online</text>
  <path class="arrow-muted" d="M248 151H282"/>
  <rect class="card" x="285" y="99" width="240" height="105" rx="10"/>
  <text x="305" y="137" class="step ink">Node for Max</text>
  <text x="305" y="165" class="detail muted">Request and pcap tests</text>
  <path class="arrow-muted" d="M528 151H562"/>
  <rect class="card" x="565" y="99" width="355" height="105" rx="10"/>
  <text x="585" y="137" class="step ink">Useful prototype</text>
  <text x="585" y="165" class="detail muted">Packet flow was not reliable here</text>
  <line class="rule" x1="40" x2="920" y1="235" y2="235"/>
  <text x="40" y="277" class="label accent">02 / RECORDED STUDY</text>
  <text x="40" y="304" class="small muted">A live request becomes a mapped projection</text>
  <rect class="card-active" x="40" y="328" width="160" height="121" rx="10"/>
  <text x="57" y="365" class="step ink">Browser</text>
  <text x="57" y="390" class="detail muted">Network request</text>
  <path class="arrow" d="M202 389H224"/>
  <rect class="card-active" x="227" y="328" width="196" height="121" rx="10"/>
  <text x="244" y="365" class="step ink">Processing</text>
  <text x="244" y="390" class="detail muted">Carnivore capture</text>
  <text x="244" y="412" class="detail muted">+ address grouping</text>
  <path class="arrow" d="M425 389H447"/>
  <rect class="card-active" x="450" y="328" width="143" height="121" rx="10"/>
  <text x="467" y="365" class="step ink">16 paths</text>
  <text x="467" y="390" class="detail muted">Moving text</text>
  <path class="arrow" d="M595 389H617"/>
  <rect class="card-active" x="620" y="328" width="138" height="121" rx="10"/>
  <text x="637" y="365" class="step ink">Syphon</text>
  <text x="637" y="390" class="detail muted">Visual output</text>
  <path class="arrow" d="M760 389H782"/>
  <rect class="card-active" x="785" y="328" width="135" height="121" rx="10"/>
  <text x="802" y="365" class="step ink">MadMapper</text>
  <text x="802" y="390" class="detail muted">Projection</text>
  <text x="40" y="487" class="small muted">Yiting: capture and address routing  ·  Wenjing: moving text  ·  Stefan: mapped projection</text>
</svg>
