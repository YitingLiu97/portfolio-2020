# Netlify configuration for Next.js app
[build]
  # Build command - change directory to my-app and build
  command = "cd my-app && npm ci && npm run build && npm run export"
  
  # Directory to publish (static export output)
  publish = "my-app/out"
  
  # Node.js version
  environment = { NODE_VERSION = "18" }

# Redirect rules for clean URLs
[[redirects]]
  from = "/posts/*"
  to = "/:splat"
  status = 301

# Handle SPA routing for client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["anonymous"]}

# Headers for better SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"